name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Sts2.slnx -c Release --nologo

      - name: Engine tests (L1 + L3 + L5)
        run: dotnet run --project tests/Sts2.Engine.Tests -c Release --no-build

      - name: RNG vector check
        run: dotnet run --project src/Sts2.Cli -c Release --no-build -- rng-verify

      - name: Replay recorded scenarios with the engine and diff snapshots
        run: |
          # Every recorded transcript in tests/vectors/real/ is replayed by the
          # engine and compared field-by-field against the real game recording.
          # Scenarios under harness/scenarios/known_gaps/ are documented gaps and are not replayed.
          fail=0
          for scenario in harness/scenarios/*.json; do
            name=$(basename "$scenario" .json)
            dotnet run --project src/Sts2.Cli -c Release --no-build -- \
              run --scenario "$scenario" --pack data/sts2 \
              --out "artifacts/engine/$name.jsonl"
            if ! python tools/compare_snapshots.py \
              --a "tests/vectors/real/$name.jsonl" \
              --b "artifacts/engine/$name.jsonl"; then
              echo "::error::snapshot parity failed for $name"
              fail=1
            fi
          done
          exit $fail

      - name: Ascension parity (A4/A5/A9/A10)
        run: |
          # Nibbit stats change at ToughEnemies (A8) and DeadlyEnemies (A9); A4 loses a potion
          # slot, A5 adds Ascender's Bane; A10 adds the double-boss flag (no combat effect here).
          for a in 4 5 9 10; do
            name="ironclad_nibbits_a$a"
            dotnet run --project src/Sts2.Cli -c Release --no-build -- run --scenario "harness/scenarios/$name.json" --pack data/sts2 --out "artifacts/engine/$name.jsonl"
            python tools/compare_snapshots.py --a "tests/vectors/real/$name.jsonl" --b "artifacts/engine/$name.jsonl"
          done

      - name: Native AOT publish and smoke test
        run: |
          dotnet publish src/Sts2.Cli -c Release -r linux-x64 -p:PublishAot=true -p:InvariantGlobalization=true -o artifacts/aot
          artifacts/aot/Sts2.Cli rng-verify
          artifacts/aot/Sts2.Cli bench --scenario harness/scenarios/ironclad_nibbits.json --iterations 2000
          artifacts/aot/Sts2.Cli run --scenario harness/scenarios/ironclad_nibbits.json --pack data/sts2 --out artifacts/engine/aot_nibbits.jsonl
          python tools/compare_snapshots.py --a tests/vectors/real/ironclad_nibbits.jsonl --b artifacts/engine/aot_nibbits.jsonl

      - name: Render single-file HTML replays
        run: |
          mkdir -p artifacts/replay
          for transcript in tests/vectors/real/*.jsonl; do
            name=$(basename "$transcript" .jsonl)
            dotnet run --project src/Sts2.Cli -c Release --no-build -- html \
              --transcript "$transcript" --out "artifacts/replay/$name.html" --title "$name"
            python tools/check_replay.py "artifacts/replay/$name.html" "$transcript"
          done

      - name: Upload replays
        uses: actions/upload-artifact@v4
        with:
          name: replays
          path: artifacts/replay

      - name: Data package vs value oracle
        run: python tools/compare_values.py --data data/sts2 --oracle tests/vectors

      - name: Local web smoke test
        run: python tools/check_web.py
